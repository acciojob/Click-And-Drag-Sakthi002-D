<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Draggable Elements</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
 <div class="container">
    <div class="cube">01</div>
    <div class="cube">02</div>
    <div class="cube">03</div>
    <div class="cube">04</div>
    <div class="cube">05</div>
    <div class="cube">06</div>
    <div class="cube">07</div>
    <div class="cube">08</div>
    <div class="cube">09</div>
  </div>
<script>
 const items = document.querySelectorAll('.item');

  let currentItem = null;
  let startX = 0;
  let startY = 0;
  let initialLeft = 0;
  let initialTop = 0;

  items.forEach((item) => {

    item.addEventListener('mousedown', (e) => {

      currentItem = item;

      startX = e.clientX;
      startY = e.clientY;

      initialLeft = item.offsetLeft;
      initialTop = item.offsetTop;
    });

  });

  document.addEventListener('mousemove', (e) => {

    if (!currentItem) return;

    const dx = e.clientX - startX;
    const dy = e.clientY - startY;

    currentItem.style.left = initialLeft + dx + 'px';
    currentItem.style.top = initialTop + dy + 'px';
  });

  document.addEventListener('mouseup', () => {
    currentItem = null;
  });
</script>
  </body>
</html>
